name: Legacy DigitalOcean Deploy (DISABLED)

# Auto-deploy on push is disabled for safety on shared hosts.
# Use workflow "Timeweb Deploy Todolist" (workflow_dispatch) instead.

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: This legacy path is disabled. Use Timeweb Deploy Todolist.
        required: true
        default: 'disabled'

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy deploy
        run: |
          echo "Legacy DigitalOcean auto-deploy is disabled."
          echo "It used docker-compose down and docker system prune -f."
          echo "Use Actions → Timeweb Deploy Todolist with confirm=deploy-todolist-timeweb."
          exit 1
