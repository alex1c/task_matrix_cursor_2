# HTTP VirtualHost for todolist.su (Timeweb). Proxy to local Docker 127.0.0.1:3004.
# TLS is added by certbot only when DNS already points at this host.

<VirtualHost *:80>
	ServerName todolist.su
	ServerAlias www.todolist.su

	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "http"
	ProxyPass / http://127.0.0.1:3004/
	ProxyPassReverse / http://127.0.0.1:3004/

	ErrorLog ${APACHE_LOG_DIR}/todolist.su-error.log
	CustomLog ${APACHE_LOG_DIR}/todolist.su-access.log combined
</VirtualHost>
